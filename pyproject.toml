[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "simai"
version = "0.1.0"
description = "Simai - a personal, encrypted, ever-growing thought tree (思脉)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "typer>=0.12",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "PyNaCl>=1.5",
    "sqlcipher3-wheels>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
simai = "simai.cli:main"

[tool.setuptools.packages.find]
include = ["simai*"]

[tool.setuptools.package-data]
simai = ["web/static/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001"]
